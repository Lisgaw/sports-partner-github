services:
  db:
    image: postgres:16-alpine
    container_name: sports_partner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sports_partner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: "postgresql://postgres:postgres@db:5432/sports_partner?connection_limit=20&pool_timeout=15"
        NEXTAUTH_SECRET: "sporpartner-super-secret-key-2026-production"
        NEXTAUTH_URL: "http://localhost:3000"
        DOCKER_BUILD: "1"
    container_name: sports_partner_app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/sports_partner?connection_limit=20&pool_timeout=15"
      NEXTAUTH_SECRET: "sporpartner-super-secret-key-2026-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - db

volumes:
  pgdata:
